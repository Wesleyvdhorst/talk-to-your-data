[project]
name = "twyd"
version = "0.1.0"
description = "Talk with your data: natural-language questions over the Olist e-commerce dataset"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.4.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the real CSVs in data/ (run on purpose)",
]
addopts = "-m 'not integration'"
